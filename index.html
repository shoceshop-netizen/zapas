<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Палети і тролі · Florium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@400..600&display=swap">
<style id="pageStyle"></style>
<style>:root{--bg:#eef1ee;--card:#ffffff;--tx:#15201a;--mu:#5f6d64;--bo:rgba(20,40,28,.10);--bo2:rgba(20,40,28,.20);--g:#2f6b4e;--g2:#245540;--gl:#e3f1e8;--am:#f5b400;
  --font:'Geist',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;--mono:'Geist Mono','SF Mono',Menlo,monospace;
  box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font)}
button{font-family:inherit}
/* верхня смуга */
.bar{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#3d7058,#2c5843);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 18px 10px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:20px}
.ttl{font-weight:800;font-size:19px;line-height:1.1}.ttl small{display:block;font-weight:500;font-size:12px;opacity:.75}
.sp{flex:1}
.bb{height:40px;padding:0 14px;border-radius:12px;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.bb.pr{background:#fff;color:var(--g2);border-color:#fff}
/* панель інструментів */
.tb{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:25;background:rgba(238,241,238,.94);backdrop-filter:blur(8px);padding:10px 18px;border-bottom:1px solid var(--bo)}
.tb .r1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tb input{flex:1 1 280px;min-width:200px;height:44px;padding:0 14px 0 40px;border:1.5px solid var(--bo2);border-radius:14px;font-family:inherit;font-size:15px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%235f6d64' stroke-width='2'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3.5-3.5'/></svg>") no-repeat 13px 50%;color:var(--tx)}
.gch{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
.gch::-webkit-scrollbar{display:none}
.gc{flex:none;height:34px;padding:0 12px;border-radius:999px;border:1.5px solid var(--bo2);background:#fff;font-weight:700;font-size:13px;cursor:pointer;color:var(--tx)}
.gc span{color:var(--mu);font-weight:600;margin-left:4px}
.tg{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mu);cursor:pointer;user-select:none;white-space:nowrap}
.tg input{width:18px;height:18px;flex:none;padding:0;background:none;border:0;min-width:0}
/* групи */
.wrap{padding:6px 18px 60px;max-width:1600px;margin:0 auto}
.grp{margin-top:18px;scroll-margin-top:140px}
.gh{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.gh h2{margin:0;font-size:24px;letter-spacing:-.02em}
.gh .st{font-size:13px;color:var(--mu)}
.occ{flex:1 1 200px;max-width:340px;height:8px;border-radius:5px;background:#d9e1db;overflow:hidden}
.occ i{display:block;height:100%;background:linear-gradient(90deg,#3e9a68,#2f6b4e);border-radius:5px}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
/* міні-палета */
.mp{position:relative;background:var(--card);border:1.5px solid var(--bo);border-radius:14px;padding:9px 9px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:132px;transition:transform .12s ease,box-shadow .12s ease;color:var(--tx)}
.mp:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.mh{display:flex;align-items:baseline;justify-content:space-between;gap:4px}
.mn{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1}
.mc{font-size:11.5px;font-weight:700;color:var(--g2);background:var(--gl);border-radius:999px;padding:2px 7px}
.ms{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;min-height:40px}
.mrow{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.mx{display:block;height:9px;border-radius:2px}
.mx.gap{background:transparent;outline:1.5px dashed #d2bd84;outline-offset:-1.5px}
.mx.none{background:transparent}
.mx.hl{box-shadow:0 0 0 2px var(--am)}
.mmore{font-size:10.5px;color:var(--mu);text-align:right}
.mbase{height:6px;border-radius:2px;background:linear-gradient(#c79a5e,#a8773f);border:1px solid #6f4a22}
.mv{font-size:11px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp.empty{background:transparent;border-style:dashed;border-color:#c6cfc8}
.mp.empty .mn{color:#9aa6a0}
.me{font-size:11.5px;color:#9aa6a0;text-align:center;align-self:center;margin:auto}
.mp.hit{border-color:var(--am);box-shadow:0 0 0 4px rgba(245,180,0,.28)}
.mp.dim{opacity:.28}
.mp.new{animation:pop .9s ease}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.04)}100%{transform:none}}
/* панель палети */
.ov{position:fixed;inset:0;z-index:60;background:rgba(10,18,14,.42);display:flex;justify-content:flex-end}
.dr{width:min(760px,100%);height:100%;background:var(--card);box-shadow:-12px 0 40px rgba(0,0,0,.2);display:flex;flex-direction:column;animation:slide .22s ease}
@keyframes slide{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.dh{padding:calc(14px + env(safe-area-inset-top,0px)) 18px 12px;border-bottom:1px solid var(--bo);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dh .pn{font-size:30px;font-weight:800;letter-spacing:-.02em}
.dh .meta{font-size:13px;color:var(--mu);flex:1}
.btn{height:40px;padding:0 13px;border-radius:12px;border:1.5px solid var(--bo2);background:#fff;color:var(--tx);font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.pr{background:var(--g);border-color:var(--g);color:#fff}
.btn.sm{height:34px;padding:0 10px;font-size:13px;border-radius:10px}
.db{padding:16px 18px 30px;overflow:auto;flex:1}
.stack{display:flex;flex-direction:column;gap:5px}
.layer{display:grid;grid-template-columns:16px repeat(5,1fr);gap:5px}
.ln{font-size:11px;color:var(--mu);display:flex;align-items:center;justify-content:center;font-weight:700}
.slot{position:relative;min-height:96px;border:2px solid #bbb;border-left-width:6px;border-radius:10px;padding:7px 8px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:#1d1d1f;cursor:pointer;overflow:hidden;min-width:0}
.slot .nm{font-size:13px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.slot .ft{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 4px;margin-top:4px}
.slot .id{font-family:var(--mono);font-size:11.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot b{font-size:15px;white-space:nowrap}
.slot .man{position:absolute;top:3px;right:5px;font-size:11px;opacity:.8}
.slot.hit{outline:3px solid var(--am);outline-offset:1px}
.slot.dim{opacity:.32}
.slot.new{animation:pop .9s ease}
.empty-slot{border:1.5px dashed #d2bd84!important;background:#fbf8ef;color:#9a8550;font-size:12px;font-weight:700;align-items:center;justify-content:center}
.none{border:none;background:transparent;cursor:default}
.base{position:relative;height:18px;margin:5px 0 0 21px;border-radius:3px;background:linear-gradient(#c79a5e,#a8773f);border:2px solid #6f4a22}
.base i{position:absolute;bottom:-10px;width:26px;height:10px;background:#8a5f30;border:2px solid #6f4a22;border-top:none;border-radius:0 0 3px 3px}
.base i:nth-child(1){left:6%}.base i:nth-child(2){left:calc(50% - 13px)}.base i:nth-child(3){right:6%}
.leg{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 10px;border-radius:999px;background:#f1f4f1;max-width:100%}
.chip i{width:12px;height:12px;border-radius:3px;border:2px solid;flex:none}
.tbl{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px}
.tbl th{text-align:left;color:var(--mu);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;padding:6px 8px;border-bottom:1px solid var(--bo)}
.tbl td{padding:7px 8px;border-bottom:1px solid #eef1ee}
.tbl td.m{font-family:var(--mono)}
.empty-big{padding:30px;text-align:center;color:var(--mu);border:2px dashed #cfd8d1;border-radius:14px}
/* вікна */
.modal{position:fixed;inset:0;z-index:90;background:rgba(10,16,12,.45);display:flex;align-items:center;justify-content:center;padding:14px}
.mbox.wide{max-width:920px!important}
.mbox{background:var(--card);border-radius:18px;padding:18px;width:100%;max-width:460px;max-height:92vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.3)}
.fld{display:block;margin:10px 0}
.fld span{display:block;font-size:12.5px;font-weight:700;color:var(--mu);margin-bottom:4px}
.fld input{width:100%;height:48px;padding:0 14px;border:1.5px solid var(--bo2);border-radius:12px;font-family:inherit;font-size:17px;background:#fff;color:var(--tx)}
.fld input.scan{font-family:var(--mono);font-size:20px;letter-spacing:.04em;border-color:var(--g)}
.found{background:var(--gl);border:1px solid #b9d8c3;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px;line-height:1.45}
.warn{background:#fff4d6;border:1px solid #e8b84a;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px;line-height:1.45}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1d2b22;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:92vw}
.toast.er{background:#8a1f1f}.toast.wa{background:#8a5a00}
.login{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--bo);border-radius:20px;padding:24px}
.login h1{margin:0;font-size:22px}
.login .logo{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pad button{height:58px;border-radius:14px;border:1.5px solid var(--bo2);background:#fff;font-size:22px;font-weight:700;cursor:pointer;color:var(--tx)}
.pad button.ok{background:var(--g);border-color:var(--g);color:#fff}
.err{color:#b42318;font-size:13.5px;min-height:18px;margin-top:6px}
.emptyall{padding:60px 20px;text-align:center;color:var(--mu)}
@media(max-width:640px){
  .bar{padding-left:12px;padding-right:12px}.ttl{font-size:17px}.bb .t{display:none}
  .tb{padding:8px 12px}.wrap{padding:4px 12px 60px}.gh h2{font-size:20px}
  .mg{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}.mp{min-height:118px;padding:7px}.mn{font-size:19px}
  .ov{align-items:flex-end}.dr{height:92vh;border-radius:18px 18px 0 0;animation:up .22s ease}
  .slot{min-height:76px;padding:5px 5px;border-left-width:5px}.slot .nm{font-size:10.5px;word-break:normal;overflow-wrap:normal;-webkit-line-clamp:3}.slot .id{font-size:9.5px}.slot b{font-size:12.5px}
  .dh{gap:6px}.dh .pn{font-size:24px}.dh .meta{flex-basis:100%;order:3}.db{padding:12px 10px 30px}.layer{gap:3px;grid-template-columns:12px repeat(5,1fr)}.stack{gap:3px}
}
/* перемикач Палети / Тролі */
.seg{display:inline-flex;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.3);border-radius:12px;padding:3px;gap:3px}
.seg button{height:34px;padding:0 12px;border:none;border-radius:9px;background:transparent;color:#fff;font-weight:700;font-size:13.5px;cursor:pointer}
.seg button.on{background:#fff;color:var(--g2)}
/* тролі */
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.cab{background:#fff;border:1.5px solid #c9b48f;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.cabh{background:linear-gradient(#efe3cc,#e3d2b1);padding:7px 10px;border-bottom:1.5px solid #c9b48f;display:flex;align-items:center}
.cabn{font-weight:800;font-size:16px;color:#5a3f17}
.cabh .sp{flex:1}
.bigcab{background:#fff;border:2.5px solid #b89b6a;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.sec{border-right:2px solid #c9b48f;border-bottom:2px solid #c9b48f;margin-right:-2px;margin-bottom:-2px}
.sech{background:linear-gradient(#efe3cc,#e3d2b1);padding:3px 10px;font-weight:800;color:#5a3f17;font-size:12.5px;font-family:var(--mono);border-bottom:1.5px solid #c9b48f}
@media(max-width:640px){.secs{grid-template-columns:1fr}}
.cabb{padding:6px 8px 8px;display:flex;flex-direction:column;gap:0}
.shelf{display:grid;grid-template-columns:18px 1fr;gap:4px;align-items:stretch;padding:4px 0;border-bottom:3px solid #c9b48f}
.shelf:last-child{border-bottom:none}
.sn{font-size:10.5px;font-weight:800;color:#8a6a3a;display:flex;align-items:center;justify-content:center}
.sc{display:grid;gap:4px}
.cs{position:relative;min-height:54px;border:2px solid #999;border-left-width:5px;border-radius:7px;padding:4px 5px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:#1d1d1f;cursor:pointer;overflow:hidden;min-width:0;background:#f4f4f4}
.cs .nm{font-size:10.5px;font-weight:700;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cs .ft{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 3px;margin-top:2px}
.cs .id{font-family:var(--mono);font-size:9.5px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs b{font-size:11px}
.cs.wait{background:#fffaf0;border:2px dashed #d39a14;border-left-width:2px;color:#7a5a12}
.cs.wait .pin{font-size:9.5px;font-weight:700;color:#a06a00;white-space:nowrap}
.cs.free{background:#fafafa;border:2px dashed #d6dbd7;border-left-width:2px;color:#9aa6a0}
/* з товаром — світиться; порожні — приглушені */
.cs.full{background:#fff;border:2px solid #2f9e5b;border-left-width:6px;box-shadow:0 1px 3px rgba(0,0,0,.08);z-index:1}
.cs.full.borrow{background:#fff8ec;border:2px dashed #e08a00;border-left-width:6px}
.cs.full .nm{font-weight:800;color:#15201a}
.cs.free,.cs.nostock{opacity:.6;box-shadow:none;filter:grayscale(1)}
.cs.free:hover,.cs.nostock:hover{opacity:.85}
.cs.nostock{background:#f6f7f6;border:2px dashed #dfe3e0;border-left-width:2px;color:#a9b3ad}
.cs.nostock .nm{font-weight:600}
.cs.cold{background:#eef7fc;border-color:#b6d9ec;color:#3f7fa6}
.ctop{display:flex;align-items:center;justify-content:space-between;gap:3px;margin-bottom:1px;min-width:0}
.ccode{font-family:var(--mono);font-size:10.5px;font-weight:800;opacity:.9;white-space:nowrap;letter-spacing:-.02em;color:#3d2c12}
.cs.planned{background:#eef6f0;border:1.5px dashed #8fbf9c;border-left-width:1.5px;color:#2f5a44}
.cs.planned .mv-from{font-size:10px;color:#1f7a45;white-space:nowrap}
.cs.leaving{opacity:.55;border-style:dashed}
.cs.leaving .mv-to{font-size:10px;color:#a06a00;white-space:nowrap}
.ctop .cat{margin:0}
.cmini{flex:none;font-size:8.5px;font-weight:800;text-transform:uppercase;padding:0 3px;border:1px solid;border-radius:3px;line-height:12px}
.cs{min-height:64px!important}
.cat{display:inline-block;align-self:flex-start;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:0 4px;border-radius:4px;border:1px solid;margin-bottom:2px;line-height:13px}
.cdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.gc .cdot{margin-right:5px}
.cs.nostock.show{color:#8d9a92;text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}
.gc.on{font-weight:800}
.cs.hit{outline:3px solid var(--am);outline-offset:1px}
.cs.dim{opacity:.3}
.cs.wrong{border-color:#d64545!important;box-shadow:inset 0 0 0 1.5px #d64545}
.cs .wr{position:absolute;top:1px;right:4px;color:#d64545;font-weight:800;font-size:12px}
.cs.none{border:none;background:transparent;cursor:default}
.choice{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.choice .btn{height:52px;justify-content:center;font-size:15px}
@media(max-width:640px){.cg{grid-template-columns:1fr}.seg button{padding:0 9px;font-size:12.5px}.bar{flex-wrap:wrap;row-gap:8px}.bar .seg{order:10;width:100%;display:flex}.bar .seg button{flex:1}.ttl small{display:none}.scan-code{font-size:32px}}

@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.scan-in-w{display:flex;gap:8px;margin:16px 0 12px}
.scan-in{flex:1;min-width:0;height:60px;border:2.5px solid var(--g);border-radius:16px;padding:0 16px;font-family:var(--mono);font-size:24px;letter-spacing:.04em;background:#fff;color:var(--tx)}
.scan-empty{padding:40px 16px;text-align:center;color:var(--mu);font-size:16px;border:2px dashed #cfd8d1;border-radius:16px}
.scan-card{background:var(--card);border:1px solid var(--bo);border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.scan-card.bad{border-color:#e8b4b0;background:#fdf1f0;text-align:center}
.scan-big{font-size:40px}
.scan-meta{font-size:13px;color:var(--mu);margin-top:6px}
.scan-ids{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.scan-ids span{display:flex;flex-direction:column;background:#f3f5f3;border:1px solid var(--bo);border-radius:10px;padding:6px 10px;min-width:100px}
.scan-ids small{font-size:11px;color:var(--mu);font-weight:700}
.scan-ids b{font-size:18px}
.scan-ids em{font-size:11px;color:#a06a00;font-style:normal}
.scan-to{margin-top:12px;background:linear-gradient(135deg,#2f6b4e,#1f4d38);color:#fff;border-radius:16px;padding:14px 16px}
.scan-to.stay{background:#e3f1e8;color:#1f4d38}
.scan-code{font-family:var(--mono);font-size:38px;font-weight:800;letter-spacing:.02em;line-height:1.1;margin:4px 0}
.scan-pal{width:100%;height:56px;border:none;border-radius:12px;font-size:26px;font-family:var(--mono);padding:0 12px;margin:6px 0;color:var(--tx)}
.mcab{margin-top:12px;border:1.5px solid #c9b48f;border-radius:12px;overflow:hidden;max-width:360px}
.mcab-h{background:linear-gradient(#efe3cc,#e3d2b1);padding:6px 10px;font-weight:800;color:#5a3f17;font-size:14px}
.mcab-r{display:grid;grid-template-columns:20px repeat(3,1fr);gap:4px;padding:4px 8px;border-bottom:3px solid #c9b48f;align-items:center}
.mcab-r:last-child{border-bottom:none}
.mcab-r span{font-size:11px;font-weight:800;color:#8a6a3a;text-align:center}
.mcab-r i{display:flex;align-items:center;justify-content:center;height:26px;border-radius:6px;font-style:normal;font-size:12px;font-weight:800}
.mcab-r i.off{background:#f4f4f4;border:1.5px dashed #d6dbd7}
.mcab-r i.on{opacity:.55}
.mcab-r i.gh{background:repeating-linear-gradient(45deg,#e3edfb 0 5px,#f3f7fd 5px 10px);border:1.5px dashed #4b7fd2}

<script>
// ===== Окрема програма: власний бекенд (цей самий Apps Script), власний вхід за PIN =====
var AUTH_KEY='palety_session_v1';
var APP_BUILD='13.11.2026 · GitHub Pages + API (p1.16)';
var PER_LAYER=5;
function G(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sess(){try{var s=JSON.parse(localStorage.getItem(AUTH_KEY)||'null');if(s&&s.token&&(!s.expiresAt||s.expiresAt>Date.now()))return s;}catch(e){}return null;}
function me(){var s=sess();return (s&&s.user)||{};}
function toast(msg,type,dur){var t=document.createElement('div');t.className='toast '+(type||'');t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},dur||2600);}
// ====== звʼязок із бекендом Apps Script ======
// Дві форми адреси одного й того самого розгортання:
//  [0] публічна — працює для всіх, потрібен доступ «Будь-хто»
//  [1] доменна  — працює лише для залогінених у florium.com
// Програма пробує по черзі й запамʼятовує ту, що відповіла.
var API_URLS=[
  'https://script.google.com/macros/s/AKfycbzjXPt0d2Z3nwVuEA1VzTlUlm2g7Y7oDdlFNU5ny6qqVnrLEMs_zoKbwede-EA6b-Qb/exec',
  'https://script.google.com/a/macros/florium.com/s/AKfycbzjXPt0d2Z3nwVuEA1VzTlUlm2g7Y7oDdlFNU5ny6qqVnrLEMs_zoKbwede-EA6b-Qb/exec'
];
var API_KEY_LS='palety_api_url';
function apiUrls(){var k=null;try{k=localStorage.getItem(API_KEY_LS);}catch(e){}
  if(k&&API_URLS.indexOf(k)>0)return[k].concat(API_URLS.filter(function(u){return u!==k;}));
  return API_URLS.slice();}

function apiPost(url,body){
  return fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
                    body:JSON.stringify(body),redirect:'follow'})
    .then(function(r){return r.text();})
    .then(function(t){var j;try{j=JSON.parse(t);}catch(e){throw new Error('not-json');}return j;});
}

function api(action,data){
  return new Promise(function(res){
    var body={action:action,data:data||{},token:''};
    if(action!=='login'){var s=sess();body.token=s?s.token:'';}
    var urls=apiUrls(), i=0;

    function done(r){
      if(r&&r.needLogin){localStorage.removeItem(AUTH_KEY);showLogin('Сесія завершилась — введіть PIN знову');res({ok:false});return;}
      // черга запису зайнята (інший працівник саме пише) — повторюємо самі, до 3 разів
      var busy=r&&!r.ok&&(r.busy||/виключн|exclusive|lock|замок/i.test(String(r.error||'')));
      if(busy){data=data||{};data._try=(data._try||0)+1;
        if(data._try<=3){toast('⏳ Інший запис ще триває — повторюю ('+data._try+' з 3)…','wa',3000);
          setTimeout(function(){api(action,data).then(res);},3000*data._try);return;}
        r.error='Сервер зайнятий іншими записами. Зачекай хвилину й спробуй ще раз.';}
      res(r);
    }

    function tryNext(lastErr){
      if(i>=urls.length){
        res({ok:false,error:lastErr==='not-json'
          ? 'Сервер не віддає дані. У розгортанні Apps Script має бути «Хто має доступ: Будь-хто».'
          : 'Нема звʼязку з сервером: '+String(lastErr||'')});
        return;
      }
      var u=urls[i++];
      apiPost(u,body).then(function(r){
        try{localStorage.setItem(API_KEY_LS,u);}catch(e){}
        done(r);
      }).catch(function(e){tryNext(String(e&&e.message||e));});
    }

    tryNext();
  });
}
// ===== Вхід за PIN =====
function showLogin(msg){
  var keys=['1','2','3','4','5','6','7','8','9','⌫','0','✓'];
  G('app').innerHTML='<div class="login"><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><div class="logo" style="background:var(--g);color:#fff">🧱</div><h1>Палети і тролі</h1></div>'
    +'<div style="color:var(--mu);font-size:13px;margin-bottom:12px">Введіть свій PIN</div>'
    +'<input id="lgP" type="password" inputmode="numeric" autocomplete="off" maxlength="8" style="width:100%;height:56px;text-align:center;font-size:28px;letter-spacing:.4em;border:1.5px solid var(--bo2);border-radius:14px;font-family:var(--mono)" onkeydown="if(event.key===\'Enter\')doLogin()">'
    +'<div class="pad">'+keys.map(function(k){return '<button type="button" onclick="padKey(\''+k+'\')"'+(k==='✓'?' class="ok"':'')+'>'+k+'</button>';}).join('')+'</div>'
    +'<div class="err" id="lgE">'+esc(msg||'')+'</div><div style="text-align:center;font-size:11.5px;color:var(--mu);margin-top:10px">версія '+esc(APP_BUILD)+'</div></div>';
  setTimeout(function(){var p=G('lgP');if(p)p.focus();},50);
}
function padKey(k){var p=G('lgP');if(!p)return;if(k==='⌫')p.value=p.value.slice(0,-1);else if(k==='✓')doLogin();else if(p.value.length<8)p.value+=k;}
async function doLogin(){
  var p=String(G('lgP').value||'').trim();if(!p){G('lgE').textContent='Введіть PIN';return;}
  G('lgE').textContent='Перевіряю…';
  var r=await api('login',{pin:p});
  if(r&&r.ok&&r.token){localStorage.setItem(AUTH_KEY,JSON.stringify({token:r.token,expiresAt:r.expiresAt,loggedAt:Date.now(),user:r.user}));start();}
  else{G('lgE').textContent=(r&&(r.error||r.msg))||'Невірний PIN';G('lgP').value='';G('lgP').focus();}
}
// ===== Працівники (лише адмін) =====
async function openUsers(){
  var r=await api('users',{});if(!r||!r.ok){toast((r&&r.error)||'Не вдалося','er');return;}
  var rl={admin:'адмін',worker:'працівник',viewer:'перегляд'};
  modal('<div style="font-size:20px;font-weight:800">👥 Працівники</div><div style="color:var(--mu);font-size:13px;margin:2px 0 10px">Кожен входить своїм PIN. Імʼя пишеться в журнал дій.</div>'
    +'<table class="tbl"><thead><tr><th>Імʼя</th><th>Роль</th><th>Активний</th><th></th></tr></thead><tbody>'+r.users.map(function(u){return '<tr><td><b>'+esc(u.name)+'</b></td><td>'+rl[u.role]+'</td><td>'+(u.active?'так':'ні')+'</td><td><button class="btn sm" onclick="editUser('+u.row+',\''+esc(u.name).replace(/'/g,'&#39;')+'\',\''+u.role+'\','+u.active+')">✎</button></td></tr>';}).join('')+'</tbody></table>'
    +'<div class="row"><button class="btn pr" onclick="editUser(0,\'\',\'worker\',true)">＋ Додати працівника</button><button class="btn" onclick="closeModal()">Закрити</button></div>');
}
function editUser(row,name,role,active){
  modal('<div style="font-size:20px;font-weight:800">'+(row?'Змінити':'Новий працівник')+'</div>'
    +'<label class="fld"><span>Імʼя</span><input id="uN" value="'+esc(name)+'"></label>'
    +'<label class="fld"><span>PIN (4–8 цифр)'+(row?' — лишіть порожнім, щоб не міняти':'')+'</span><input id="uP" inputmode="numeric" maxlength="8"></label>'
    +'<label class="fld"><span>Роль</span><select id="uR" style="width:100%;height:48px;border:1.5px solid var(--bo2);border-radius:12px;font-size:16px;padding:0 10px"><option value="worker"'+(role==='worker'?' selected':'')+'>працівник — кладе, переміщує, знімає</option><option value="viewer"'+(role==='viewer'?' selected':'')+'>перегляд — лише дивиться</option><option value="admin"'+(role==='admin'?' selected':'')+'>адмін — усе + працівники і ячейки</option></select></label>'
    +'<label class="tg" style="margin:6px 0"><input type="checkbox" id="uA" '+(active?'checked':'')+'> активний</label>'
    +'<div class="row"><button class="btn pr" onclick="saveUser('+row+')">Зберегти</button><button class="btn" onclick="openUsers()">Назад</button></div>','sm');
}
async function saveUser(row){
  var r=await api('userSave',{row:row,name:G('uN').value,pin:G('uP').value,role:G('uR').value,active:G('uA').checked});
  if(r&&r.ok){toast('Збережено','',1500);openUsers();}else toast((r&&r.error)||'Не вдалося','er',3500);
}

// ===== Дані =====
var S={cat:'',stock:[],byId:{},slots:{},manual:[],locs:{},at:0,q:'',kind:'all',pending:{},saveT:null,fresh:{},loading:false,open:null,hideEmpty:false,mode:(localStorage.getItem('plMode')||'pal'),cells:[],fixed:[],cellsLoading:false,cellsErr:'',cabStockOnly:true,cabTodoOnly:false,cabHideEmpty:(localStorage.getItem('cabHideEmpty')!=='0'),cabCompact:false};
var COLORS=[['#eaf2ff','#2f6fd0'],['#e9f7ee','#2e9a55'],['#fff3df','#d98a00'],['#f5ebfb','#8e44c4'],['#e6f6f4','#139186'],['#fdeaef','#d0436b']];
function color(art){var h=0,s=String(art||'');for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return COLORS[h%COLORS.length];}
function kindOf(loc){loc=String(loc||'').trim();if(/^\d{1,5}$/.test(loc))return 'pal';if(/^\d+(-\d+){2,}$/.test(loc))return 'cell';return 'other';}
function rowObj(r){if(!r||!String(r[0]||'').trim())return null;return {art:String(r[0]).trim(),boxId:String(r[1]||'').trim(),qty:parseInt(r[2]||0)||0,name:String(r[3]||'').trim(),size:String(r[4]||'').trim(),supplier:String(r[5]||'').trim(),location:String(r[6]||'').trim(),bulbs:parseInt(r[7]||0)||0,leftRaw:(r[7]==null?'':String(r[7]).trim()),date:String(r[8]||'').trim(),boxStatus:String(r[9]||'').trim()};}

async function cellAssign(code,clear){
  var art=clear?'':String((G('caA')||{}).value||'').trim(),name=clear?'':String((G('caN')||{}).value||'').trim();
  if(!clear&&!art){toast('Вкажи артикул','wa');return;}
  var r=await api('cellAssign',{cell:code,art:art,name:name});
  if(!r||!r.ok){toast('Не вдалося: '+((r&&(r.error||r.msg))||'?'),'er');return;}
  S.fixed=(S.fixed||[]).filter(function(x){return x[0]!==code;}).concat([r.rec]);
  closeModal();toast(clear?'Ячейку '+code+' відкріплено':'📌 '+code+' → '+art,'',2200);render();
}

// ===== 📐 ПЛАН РОЗКЛАДКИ ВСІХ ШАФ =====
// 1) Троль задіяна, якщо в ній буде ≥ minCab ящиків (вже лежать + свої сорти, що є в запасі). Порожні й ті, де 0–3 ящики, не чіпаємо — ці сорти лишаються на палетах.

function code128(text){
  text=String(text).replace(/[^\x20-\x7E]/g,'');var n=text.length,out=[],mode='';
  var isD=function(c){return c>='0'&&c<='9';},run=function(k){var j=k;while(j<n&&isD(text[j]))j++;return j-k;};
  var toB=function(){if(mode==='')out.push(104);else if(mode==='C')out.push(100);mode='B';},toC=function(){if(mode==='')out.push(105);else if(mode==='B')out.push(99);mode='C';};
  var i=0;while(i<n){var r=run(i);if(r>=4||(mode==='C'&&r>=2)){if(mode!=='C'&&r%2===1){toB();out.push(text.charCodeAt(i)-32);i++;continue;}toC();out.push(parseInt(text.substr(i,2),10));i+=2;}else{toB();out.push(text.charCodeAt(i)-32);i++;}}
  if(!out.length)return null;var sum=out[0];for(var k=1;k<out.length;k++)sum+=out[k]*k;out.push(sum%103,106);
  var w='';out.forEach(function(v){w+=C128[v];});return w;
}

  ADD={p:p||ADD.p||'',id:'',found:null,from:''};
  var pals=build().filter(function(P){return P.kind==='pal';}).map(function(P){return P.p;});
  modal('<div style="font-size:20px;font-weight:800">＋ Розмістити ящик</div><div style="color:var(--mu);font-size:13px;margin-top:2px">Скануй ящик або впиши ID і натисни Enter. Якщо в сорту є своя ячейка в тролі і вона порожня — програма запропонує її, інакше — палету. Можна сканувати підряд.</div>'
    +'<label class="fld"><span>Палета для запасу</span><input id="adP" list="adPL" value="'+esc(slotOf(ADD.p)?'':ADD.p)+'" placeholder="наприклад 50"></label><datalist id="adPL">'+pals.map(function(p){return '<option value="'+esc(p)+'">';}).join('')+'</datalist>'
    +'<label class="fld"><span>ID ящика</span><input id="adI" class="scan" autocomplete="off" placeholder="70071861" onkeydown="scanKey(event,this,lookupBox)" oninput="scanInput(this,lookupBox)"></label>'
    +'<div id="adR"></div><div class="row"><button class="btn" onclick="lookupBox()">🔍 Знайти</button><button class="btn" onclick="closeModal()">Готово</button></div>','sm');
  if(slotOf(ADD.p))ADD.cell=ADD.p;else ADD.cell='';
  setTimeout(function(){G('adI').focus();},60);
}
async function lookupBox(){
  var p=String(G('adP').value||'').trim(),ps=parseScan(G('adI').value),id=ps.id;if(id&&G('adI').value!==id)G('adI').value=id;ADD.ps=ps;
  if(!id){G('adI').focus();return;}
  ADD.p=p;ADD.id=id;var R=G('adR');
  var cur=findBox(id);
  if(cur){
    if(p&&cur.P.p===p){R.innerHTML='<div class="warn">Ящик <b>'+esc(id)+'</b> уже тут: '+esc(p)+'.</div>';G('adI').select();return;}
    ADD.from=cur.P.p;ADD.found=cur.x.b;
    R.innerHTML='<div class="warn">Ящик <b>'+esc(id)+'</b> — '+esc(cur.x.b.name||cur.x.b.art)+' — зараз на <b>'+esc(cur.P.p)+'</b>.</div>'+placeChoice(cur.x.b.art,id,'↔ Перемістити');
    return;
  }
  ADD.from='';R.innerHTML='<div class="found">Шукаю на складі…</div>';
  var r=await api('boxLookup',{boxId:id});
  if(r&&r.ok&&r.found){var b=rowObj(r.row);ADD.found=b;
    R.innerHTML='<div class="found"><b>'+esc(b.name||b.art)+'</b><br><span style="font-family:var(--mono)">'+esc(b.art)+'</span> · '+(boxLeft(b)==null?b.qty:boxLeft(b))+' шт'+(b.boxStatus?' · '+esc(b.boxStatus):'')+(b.location?' · у «товар склад»: '+esc(b.location):'')+'</div>'+placeChoice(b.art,id,'＋ Покласти');
    setTimeout(function(){var g=G('adGo');if(g)g.focus();},30);
  }else{
    ADD.found=null;var arts={};S.stock.forEach(function(b){if(!arts[b.art])arts[b.art]=b.name;});
    R.innerHTML='<div class="warn">Ящика <b>'+esc(id)+'</b> нема в «товар склад». Додати як новий?</div>'
      +'<label class="fld"><span>Артикул</span><input id="adA" list="adAL" oninput="var n=G(\'adN\');var v=this.value.trim();if(n&&!n.value&&window._arts&&window._arts[v])n.value=window._arts[v];"></label><datalist id="adAL">'+Object.keys(arts).slice(0,3000).map(function(a){return '<option value="'+esc(a)+'">'+esc(arts[a])+'</option>';}).join('')+'</datalist>'
      +'<label class="fld"><span>Назва</span><input id="adN"></label><label class="fld"><span>Кількість у ящику, шт</span><input id="adQ" inputmode="numeric"></label>'
      +'<div id="adCh"></div><div class="row"><button class="btn" onclick="var a=G(\'adA\').value.trim();if(!a){toast(\'Вкажи артикул\',\'wa\');return;}G(\'adCh\').innerHTML=placeChoice(a,ADD.id,\'＋ Додати новий ящик\');">Далі →</button></div>';
    window._arts=arts;
    if(ADD.ps&&ADD.ps.art){G('adA').value=ADD.ps.art;if(arts[ADD.ps.art])G('adN').value=arts[ADD.ps.art];if(ADD.ps.qty)G('adQ').value=ADD.ps.qty;}
    setTimeout(function(){(ADD.ps&&ADD.ps.art?G('adN'):G('adA')).focus();},30);
  }
}
// куди класти: якщо в сорту є своя ячейка і вона порожня — туди; інакше — у запас на палету
function placeChoice(art,id,verb){
  var hf=homeFree(art,id),p=String((G('adP')||{}).value||'').trim(),h='<div class="choice">';
  var nmA=(S.boxes[id]&&S.boxes[id].name)||(ADD.found&&ADD.found.name)||String((G('adN')||{}).value||'');if(noTroll({name:nmA})||fromCold(S.boxes[id]))hf={home:'',busy:null};
  if(!p){var np0=nearestPallet(S.boxes[id]||{boxId:id,art:art,name:'',state:'in',location:''});if(np0){p=np0.p;var pi0=G('adP');if(pi0)pi0.value=p;}}
  if(ADD.cell){   // відкрили «Покласти ящик сюди» з конкретної ячейки
    var other=hf.home&&slotKeyOf(hf.home)!==slotKeyOf(ADD.cell);
    h+='<button class="btn pr" id="adGo" onclick="commitAdd(\''+esc(ADD.cell)+'\')">🗄 У ячейку '+esc(ADD.cell)+'</button>'+(other?'<div class="warn" style="margin:0">У цього сорту своя ячейка — '+esc(hf.home)+'.</div>':'');
    h+='<button class="btn" onclick="commitAdd(\'@pal\')">🧱 '+esc(verb)+' на палету'+(p?' '+esc(p):'…')+'</button>';
    setTimeout(function(){var g=G('adGo');if(g)g.focus();},30);return h+'</div>';
  }
  if(hf.home&&!hf.busy){h+='<button class="btn pr" id="adGo" onclick="commitAdd(\''+esc(hf.home)+'\')">🗄 У троль '+esc(hf.home)+'</button>';
    h+='<button class="btn" onclick="commitAdd(\'@pal\')">🧱 '+esc(verb)+' на палету'+(p?' '+esc(p):'…')+'</button><div style="font-size:12.5px;color:var(--mu)">Ячейка '+esc(hf.home)+' цього сорту порожня — перший ящик іде туди, решта — у запас на палети.</div>';}
  else{var fnb='';   // адреса лише з файлу — у чужі ячейки автоматично не кладемо
    if(hf.home)h+='<div class="found" style="margin:0">🗄 У ячейці '+esc(hf.home)+' вже є ящик '+esc(hf.busy.id)+(fnb?' — поруч є вільна '+esc(fnb)+'.':' — цей у запас на палету.')+'</div>';
    if(fnb)h+='<button class="btn pr" id="adGo" onclick="commitAdd(\''+esc(fnb)+'\')">🗄 Поруч у вільну ячейку '+esc(fnb)+'</button><button class="btn" onclick="commitAdd(\'@pal\')">🧱 '+esc(verb)+' на палету'+(p?' '+esc(p):'…')+'</button>';
    else h+='<button class="btn pr" id="adGo" onclick="commitAdd(\'@pal\')">🧱 '+esc(verb)+' на палету'+(p?' '+esc(p):'…')+'</button>';}
  setTimeout(function(){var g=G('adGo');if(g)g.focus();},30);
  return h+'</div>';
}
async function commitAdd(target){
  if(!target||target==='@pal'){var pv=String((G('adP')||{}).value||'').trim();if(!pv){toast('Вкажи номер палети','wa');var pi=G('adP');if(pi)pi.focus();return;}ADD.p=pv;}
  else ADD.p=target;
  var b=ADD.found,art=b?b.art:String((G('adA')||{}).value||'').trim(),name=b?b.name:String((G('adN')||{}).value||'').trim(),qty=b?(boxLeft(b)==null?b.qty:boxLeft(b)):String((G('adQ')||{}).value||'').trim();
  if(!b&&!art){toast('Вкажи артикул','wa');return;}
  var r=await api('palletBox',{op:'add',pallet:ADD.p,boxId:ADD.id,from:ADD.from,art:art,name:name,qty:qty,g0:((S.boxes[ADD.id]||{}).g||''),st:((S.boxes[ADD.id]||{}).state||'')});
  if(!r||!r.ok){toast('Не вдалося: '+((r&&(r.error||r.msg))||'?'),'er',4000);return;}
  S.manual.push([r.at,ADD.p,ADD.id,art,name,String(qty),me().name||'',r.act,ADD.from]);
  if(r.slots){if(r.slots.to)S.slots[ADD.p]=r.slots.to;if(ADD.from&&r.slots.from)S.slots[ADD.from]=r.slots.from;}
  S.fresh[ADD.id]=1;try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}
  if(S.boxes[ADD.id]){S.boxes[ADD.id].location=ADD.p;S.boxes[ADD.id].state='in';}else S.boxes[ADD.id]=liveBoxObj([ADD.id,art,name,qty,'', 'in',ADD.p,'',Date.now(),'','',0]);liveSoon();
  toast((r.act==='переміщено'?'↔ Переміщено на ':'✓ Покладено на ')+(slotOf(ADD.p)?'':'палету ')+ADD.p+fasNote(r),r&&r.fas&&!/^ok|^те саме/.test(r.fas)?'wa':'',3000);
  var keepP=(target&&target!=='@pal')?String((G('adP')||{}).value||'').trim():ADD.p;render();openAdd(keepP);   // одразу готові до наступного скану
}
async function moveBox(id,toCell){
  var f=findBox(id)||findAny(id);if(!f)return;var to=toCell||prompt('Куди перемістити ящик '+id+'? (палета або ячейка)','');if(!to)return;to=to.trim();if(!to||to===f.P.p)return;
  var b=f.x.b,r=await api('palletBox',{op:'add',pallet:to,boxId:id,from:f.P.p,art:b.art,name:b.name,qty:boxLeft(b)==null?b.qty:boxLeft(b),g0:((S.boxes[id]||{}).g||''),st:((S.boxes[id]||{}).state||'')});
  if(!r||!r.ok){toast('Не вдалося: '+((r&&(r.error||r.msg))||'?'),'er');return;}
  S.manual.push([r.at,to,id,b.art,b.name,'',me().name||'',r.act,f.P.p]);if(r.slots){if(r.slots.to)S.slots[to]=r.slots.to;if(r.slots.from)S.slots[f.P.p]=r.slots.from;}
  S.fresh[id]=1;if(S.boxes[id]){S.boxes[id].location=to;S.boxes[id].state='in';}closeModal();toast((slotOf(to)?'🗄 Покладено в троль '+to:'↔ Переміщено на палету '+to)+fasNote(r),r&&r.fas&&!/^ok|^те саме/.test(r.fas)?'wa':'',4000);render();liveSoon();
}
function findAny(id){var x=placements()[id];return x?{P:{p:x.p},x:x}:null;}
async function removeBox(id){
  var f=findBox(id)||findAny(id);if(!f)return;if(!confirm('Зняти ящик '+id+' з палети '+f.P.p+'? Його місце стане вільним.'))return;
  var b=f.x.b,r=await api('palletBox',{op:'remove',boxId:id,from:f.P.p,art:b.art,name:b.name,g0:((S.boxes[id]||{}).g||''),st:((S.boxes[id]||{}).state||'')});
  if(!r||!r.ok){toast('Не вдалося: '+((r&&(r.error||r.msg))||'?'),'er');return;}
  S.manual.push([r.at,f.P.p,id,b.art,b.name,'',me().name||'','знято','']);if(r.slots&&r.slots.from)S.slots[f.P.p]=r.slots.from;
  if(S.boxes[id])delete S.boxes[id];closeModal();toast('✕ Знято з палети '+f.P.p);render();liveSoon();
}
function logout(){if(!confirm('Вийти?'))return;api('logout',{});localStorage.removeItem(AUTH_KEY);try{localStorage.removeItem(SNAP_KEY);}catch(e){}showLogin();}
function start(){snapLoad();render();load();}
setInterval(function(){if(!document.hidden&&sess()&&!document.querySelector('.modal'))load();},600000);
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(document.querySelector('.modal'))closeModal();else if(S.side)sideClose();else if(S.open)closePallet();}});
if(sess())start();else showLogin();
</script>
